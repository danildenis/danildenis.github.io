<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><title>Мобильная версия — предпросмотр</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #1c1b19; color: #d7c9ae; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: grid; justify-items: center; gap: 16px; padding: 24px 12px; box-sizing: border-box; }
  .phone { width: min(390px, 100%); height: min(844px, calc(100vh - 110px)); border: 10px solid #000; border-radius: 48px; overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / 0.6); background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  a { color: #d7c9ae; }
</style>
</head>
<body>
  <div>Мобильная версия · <a href="/">открыть версию для компьютера</a></div>
  <div class="phone"><iframe src="/" title="Сайт в размере телефона"></iframe></div>
</body>
</html>
